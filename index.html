<html lang="ru">

<title>Стих</title>

<style>
  :root {
    --ink: #4a3a40;
    --ink-soft: #8a6f78;
    --card: rgba(255, 251, 249, 0.72);
    --accent: #c99aa6;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { min-height: 100%; }

  body {
    background: #f6ece8;
    color: var(--ink);
    font-family: "Cormorant Garamond", Georgia, serif;

    inset: 0;
    z-index: -2;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }
  .photos img {
    display: block;
    object-fit: cover;
    opacity: 0.8;
    filter: saturate(0.85) contrast(0.95);
    -webkit-mask-image: radial-gradient(ellipse closest-side, #000 62%, transparent 100%);
            mask-image: radial-gradient(ellipse closest-side, #000 62%, transparent 100%);
    animation: drift 18s ease-in-out infinite alternate;
  }
  .photos .left  { height: 58vh; aspect-ratio: 16 / 9; margin-top: -14vh; position: relative; left: -24vw; }
  .photos .right {
    height: 84vh; aspect-ratio: 3 / 4; margin-left: -16vh; margin-top: 8vh;
    animation-delay: -9s;

  @keyframes drift {
    from { transform: translateY(-6px); }
    to   { transform: translateY(6px); }
  }

  /* лёгкая вуаль, чтобы фото не спорили с текстом */
  .veil {
    position: fixed;
    inset: 0;
    z-index: -1;
    background: radial-gradient(ellipse at center, rgba(252,245,242,0.35) 0%, rgba(252,245,242,0.12) 60%, rgba(252,245,242,0) 100%);
  }

  /* на узких/вертикальных экранах — фото друг под другом */
  /* на телефоне (вертикальный экран) — фото отдельным коллажем над стихом */
  @media (max-aspect-ratio: 1/1) {
    .photos {
      position: relative;
      inset: auto;
      z-index: 0;
      display: block;
      padding-top: 5vh;
      overflow: hidden;
    }
    .photos img {
      opacity: 0.95;
      -webkit-mask-image: radial-gradient(ellipse closest-side, #000 72%, transparent 100%);
              mask-image: radial-gradient(ellipse closest-side, #000 72%, transparent 100%);
    }
    .photos .left  { height: auto; width: 104vw; margin: 0 0 0 -8vw; left: 0; }
    .photos .right {
      position: relative;
      z-index: 1;
      height: auto; width: 66vw;
      margin: -20vw 2vw 0 auto;
    }
    body main { padding-top: 0; margin-top: -4vw; position: relative; }
  }

  /* ---------- текст ---------- */
  main {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 12vh 16px 14vh;
  }

  .poem {
    width: 100%;
    max-width: 620px;
    text-align: center;
    padding: 56px 40px 60px;
    background: var(--card);
    border-radius: 28px;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    box-shadow: 0 30px 80px -40px rgba(120, 80, 90, 0.35);
  }

  .ornament {
    font-family: "Marck Script", cursive;
    color: var(--accent);
    font-size: 2.2rem;
    line-height: 1;
    letter-spacing: 0.3em;
    margin-bottom: 36px;
    opacity: 0.85;
  }

  .stanza {
    font-size: clamp(1.2rem, 1.05rem + 0.6vw, 1.45rem);
    line-height: 1.7;
    font-weight: 500;
    margin-bottom: 2.1em;
    opacity: 0;
    transform: translateY(14px);
    transition: opacity 1.4s ease, transform 1.4s ease;
  }
  .stanza.visible { opacity: 1; transform: none; }
  .stanza:last-of-type { margin-bottom: 0; }

  .stanza span { display: block; }

  .divider {
    width: 48px;
    height: 1px;
    margin: 0 auto 2.1em;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
  }

  .heart {
    margin-top: 44px;
    color: var(--accent);
    font-size: 1.3rem;
    opacity: 0.8;
  }

  @media (max-width: 520px) {
    main { padding-left: 12px; padding-right: 12px; padding-bottom: 10vh; }
    .poem { padding: 36px 12px 40px; border-radius: 22px; }
    .stanza { font-size: 1.07rem; line-height: 1.75; }
  }

  /* ---------- окно с вопросом ---------- */
  body.locked { overflow: hidden; }

  .lock {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    background: rgba(248, 238, 235, 0.92);
    backdrop-filter: blur(30px);
    -webkit-backdrop-filter: blur(30px);
    transition: opacity 1.2s ease, visibility 1.2s;
  }
  .lock.open { opacity: 0; visibility: hidden; }

  .lock-card {
    width: 100%;
    max-width: 420px;
    text-align: center;
    padding: 44px 32px 40px;
    background: rgba(255, 251, 249, 0.85);
    border-radius: 28px;
    box-shadow: 0 30px 80px -40px rgba(120, 80, 90, 0.45);
  }

  .lock-card .ornament { margin-bottom: 24px; }

  .question {
    font-size: 1.55rem;
    line-height: 1.4;
    font-weight: 500;
    font-style: italic;
    margin-bottom: 30px;
  }

  .digits {
    display: flex;
    justify-content: center;
    gap: 12px;
  }
  .digits input {
    width: 52px;
    height: 62px;
    text-align: center;
    font: 500 1.8rem "Cormorant Garamond", Georgia, serif;
    color: var(--ink);
    background: rgba(255, 255, 255, 0.7);
    border: 1px solid rgba(201, 154, 166, 0.45);
    border-radius: 14px;
    outline: none;
    caret-color: var(--accent);
    transition: border-color 0.3s, box-shadow 0.3s;
  }
  .digits input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 4px rgba(201, 154, 166, 0.18);
  }

  .hint {
    min-height: 1.4em;
    margin-top: 20px;
    font-size: 1.1rem;
    font-style: italic;
    color: var(--ink-soft);
  }

  .shake { animation: shake 0.45s ease; }
  @keyframes shake {
    20%, 60% { transform: translateX(-7px); }
    40%, 80% { transform: translateX(7px); }
  }

  @media (prefers-reduced-motion: reduce) {
    .photos img { animation: none; }
    .stanza { opacity: 1; transform: none; transition: none; }
    .shake { animation: none; }
  }
</style>
</head>
<body class="locked">
  <div class="lock" id="lock" role="dialog" aria-modal="true" aria-labelledby="question">
    <form class="lock-card" id="lockForm" autocomplete="off">
      <div class="ornament">~ ♡ ~</div>
      <p class="question" id="question">Тот самый день с&nbsp;первым «спишь?»</p>
      <div class="digits">
        <input inputmode="numeric" maxlength="1" aria-label="Цифра 1">
        <input inputmode="numeric" maxlength="1" aria-label="Цифра 2">
        <input inputmode="numeric" maxlength="1" aria-label="Цифра 3">
        <input inputmode="numeric" maxlength="1" aria-label="Цифра 4">
      </div>
      <p class="hint" id="hint" aria-live="polite"></p>
    </form>
  </div>

  <div class="photos" aria-hidden="true">
    <picture>
      <source media="(max-aspect-ratio: 1/1)" srcset="L-m.jpg">
      <img class="left" src="L.jpg" alt="" fetchpriority="high" decoding="async">
    </picture>
    <picture>
      <source media="(max-aspect-ratio: 1/1)" srcset="o-m.jpg">
      <img class="right" src="o.jpg" alt="" fetchpriority="high" decoding="async">
    </picture>
  </div>
  <div class="veil"></div>

  <main>
    <article class="poem" id="poem">
      <div class="ornament">~ ♡ ~</div>
    </article>
  </main>

<script>
  const text = `Он для неё готов был звёзды с неба снять,
Дороже всех сокровищ и миров,
Он сердце ей носил, как дети — тетрадь,
Не требуя ни клятв, ни лишних слов.

Он шёл к ней через холод и дожди,
Искал слова, что греют, а не жгут.
Она шептала: «Подожди... не приходи...»
И закрывала дверь на ржавый крюк.

А он сидел в ночи, смотря в окно,
И задавал один и тот же вопрос:
«За что нам это? Ведь должно быть легко,
Когда огонь так искренне пророс?»

Ведь были дни — смеялись до утра,
И солнце отражалось в их глазах.
Она держала за руку... вчера.
Но прячет свет в зашторенных стенах.

Она сидит в той «маленькой комнате»,
Где тихо, безопасно и темно.
Боится, что за дверью — не поймёт,
Что за порогом — слишком глубоко.

Боится, что откроет — и вдохнёт
То чувство, что сильнее, чем она.
И рухнут стены, и произойдёт
То, что не выдержит её броня.

Но если ты не выйдешь — не узнать,
Как пахнет небо, если рядом он.
Не выйдешь — не почувствуешь опять,
Как сердце бьётся в унисон.

А он всё ждёт. И верит. И горит.
И в тишине рисует её смех.
Он двери не ломает — он хранит
Надежду, что однажды хватит сил у всех.`;

  const poem = document.getElementById('poem');
  const stanzas = text.trim().split(/\n\s*\n/);

  stanzas.forEach((block, i) => {
    if (i > 0) {
      const d = document.createElement('div');
      d.className = 'divider';
      poem.appendChild(d);
    }
    const p = document.createElement('p');
    p.className = 'stanza';
    block.split('\n').forEach(line => {
      const s = document.createElement('span');
      s.textContent = line;
      p.appendChild(s);
    });
    poem.appendChild(p);
  });

  const heart = document.createElement('div');
  heart.className = 'heart';
  heart.textContent = '♡';
  poem.appendChild(heart);

  function revealPoem() {
    const io = new IntersectionObserver(entries => {
      entries.forEach(e => {
        if (e.isIntersecting) { e.target.classList.add('visible'); io.unobserve(e.target); }
      });
    }, { threshold: 0.15 });
    document.querySelectorAll('.stanza').forEach(el => io.observe(el));
  }

  /* ---------- вопрос ---------- */
  const lock = document.getElementById('lock');
  const form = document.getElementById('lockForm');
  const hint = document.getElementById('hint');
  const inputs = [...form.querySelectorAll('input')];
  const ANSWER = '2006';

  inputs[0].focus();

  function check() {
    const code = inputs.map(i => i.value).join('');
    if (code.length < 4) return;
    if (code === ANSWER) {
      inputs.forEach(i => i.blur());
      hint.textContent = '♡';
      lock.classList.add('open');
      document.body.classList.remove('locked');
      setTimeout(revealPoem, 500);
      setTimeout(() => lock.remove(), 1400);
    } else {
      hint.textContent = 'Не тот день… попробуй ещё раз';
      form.classList.remove('shake');
      void form.offsetWidth;
      form.classList.add('shake');
      setTimeout(() => {
        inputs.forEach(i => i.value = '');
        inputs[0].focus();
      }, 450);
    }
  }

  inputs.forEach((input, idx) => {
    input.addEventListener('input', () => {
      input.value = input.value.replace(/\D/g, '').slice(-1);
      if (input.value && idx < 3) inputs[idx + 1].focus();
      check();
    });
    input.addEventListener('keydown', e => {
      if (e.key === 'Backspace' && !input.value && idx > 0) {
        inputs[idx - 1].value = '';
        inputs[idx - 1].focus();
        e.preventDefault();
      }
    });
    input.addEventListener('paste', e => {
      const digits = (e.clipboardData.getData('text') || '').replace(/\D/g, '').slice(0, 4);
      if (!digits) return;
      e.preventDefault();
      digits.split('').forEach((d, k) => { if (inputs[k]) inputs[k].value = d; });
      inputs[Math.min(digits.length, 3)].focus();
      check();
    });
  });

  form.addEventListener('submit', e => { e.preventDefault(); check(); });
</script>
</body>
</html>
