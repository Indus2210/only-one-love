<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Стих</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Marck+Script&display=swap&subset=cyrillic" rel="stylesheet" media="print" onload="this.media='all'">
<style>
  :root {
    --ink: #4a3a40;
    --ink-soft: #8a6f78;
    --card: rgba(255, 251, 249, 0.72);
    --accent: #c99aa6;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { min-height: 100%; }

  body {
    background: #f6ece8;
    color: var(--ink);
    font-family: "Cormorant Garamond", Georgia, serif;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- текст ---------- */
  main {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 12vh 16px 14vh;
  }

  .poem {
    width: 100%;
    max-width: 620px;
    text-align: center;
    padding: 56px 40px 60px;
    background: var(--card);
    border-radius: 28px;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    box-shadow: 0 30px 80px -40px rgba(120, 80, 90, 0.35);
  }

  .ornament {
    font-family: "Marck Script", cursive;
    color: var(--accent);
    font-size: 2.2rem;
    line-height: 1;
    letter-spacing: 0.3em;
    margin-bottom: 36px;
    opacity: 0.85;
  }

  .stanza {
    font-size: clamp(1.2rem, 1.05rem + 0.6vw, 1.45rem);
    line-height: 1.7;
    font-weight: 500;
    margin-bottom: 2.1em;
    opacity: 0;
    transform: translateY(14px);
    transition: opacity 1.4s ease, transform 1.4s ease;
  }
  .stanza.visible { opacity: 1; transform: none; }
  .stanza:last-of-type { margin-bottom: 0; }

  .stanza span { display: block; }

  .divider {
    width: 48px;
    height: 1px;
    margin: 0 auto 2.1em;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
  }

  .heart {
    margin-top: 44px;
    color: var(--accent);
    font-size: 1.3rem;
    opacity: 0.8;
  }

  @media (max-width: 520px) {
    main { padding-left: 12px; padding-right: 12px; padding-bottom: 10vh; }
    .poem { padding: 36px 12px 40px; border-radius: 22px; }
    .stanza { font-size: 1.07rem; line-height: 1.75; }
  }

  @media (prefers-reduced-motion: reduce) {
    .stanza { opacity: 1; transform: none; transition: none; }
  }
</style>
</head>
<body>
  <main>
    <article class="poem" id="poem">
      <div class="ornament">~ ♡ ~</div>
    </article>
  </main>

<script>
  const text = `За что?`;

  const poem = document.getElementById('poem');
  const stanzas = text.trim().split(/\n\s*\n/);

  stanzas.forEach((block, i) => {
    if (i > 0) {
      const d = document.createElement('div');
      d.className = 'divider';
      poem.appendChild(d);
    }
    const p = document.createElement('p');
    p.className = 'stanza';
    block.split('\n').forEach(line => {
      const s = document.createElement('span');
      s.textContent = line;
      p.appendChild(s);
    });
    poem.appendChild(p);
  });

  const heart = document.createElement('div');
  heart.className = 'heart';
  heart.textContent = '♡';
  poem.appendChild(heart);

  function revealPoem() {
    const io = new IntersectionObserver(entries => {
      entries.forEach(e => {
        if (e.isIntersecting) { e.target.classList.add('visible'); io.unobserve(e.target); }
      });
    }, { threshold: 0.15 });
    document.querySelectorAll('.stanza').forEach(el => io.observe(el));
  }

  revealPoem();

</script>
</body>
</html>
